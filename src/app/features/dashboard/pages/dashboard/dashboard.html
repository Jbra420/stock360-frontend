<div class="dashboard-container" *ngIf="!loading">

  <div class="page-header">
    <h1>Dashboard</h1>
    <p>Resumen general del inventario</p>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <mat-card class="stat-card">
      <div class="stat-content">
        <div class="stat-icon productos">
          <mat-icon>inventory_2</mat-icon>
        </div>
        <div class="stat-info">
          <h3>{{ totalProductos }}</h3>
          <p>Total Productos</p>
        </div>
      </div>
    </mat-card>

    <mat-card class="stat-card">
      <div class="stat-content">
        <div class="stat-icon categorias">
          <mat-icon>category</mat-icon>
        </div>
        <div class="stat-info">
          <h3>{{ totalCategorias }}</h3>
          <p>Categorías</p>
        </div>
      </div>
    </mat-card>

    <mat-card class="stat-card alert">
      <div class="stat-content">
        <div class="stat-icon warning">
          <mat-icon>warning</mat-icon>
        </div>
        <div class="stat-info">
          <h3>{{ productosStockBajo }}</h3>
          <p>Stock Bajo</p>
        </div>
      </div>
    </mat-card>

    <mat-card class="stat-card">
      <div class="stat-content">
        <div class="stat-icon movimientos">
          <mat-icon>sync_alt</mat-icon>
        </div>
        <div class="stat-info">
          <h3>{{ movimientosRecientes }}</h3>
          <p>Movimientos Hoy</p>
        </div>
      </div>
    </mat-card>
  </div>

  <!-- DONUT CHART -->
  <div class="section">
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          <mat-icon>donut_large</mat-icon>
          Estado del Stock
        </mat-card-title>
      </mat-card-header>

      <mat-card-content class="chart-box">
        <canvas
          baseChart
          [type]="'doughnut'"
          [data]="doughnutChartData"
          [options]="doughnutChartOptions">
      </canvas>
      </mat-card-content>
    </mat-card>
  </div>

</div>

<!-- LOADING -->
<div class="loading-container" *ngIf="loading">
  <mat-spinner></mat-spinner>
  <p>Cargando dashboard...</p>
</div>
