<div class="register-container">
  <mat-card class="register-card">

    <mat-card-header>
      <div class="header-content">
        <mat-icon class="logo-icon">inventory_2</mat-icon>
        <h1>Crear Cuenta</h1>
        <p>Regístrate en Stock360</p>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="nombre">
            <mat-icon matPrefix>person</mat-icon>
            <mat-error *ngIf="registerForm.get('nombre')?.invalid">
              El nombre es requerido
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="apellido">
            <mat-icon matPrefix>person</mat-icon>
            <mat-error *ngIf="registerForm.get('apellido')?.invalid">
              El apellido es requerido
            </mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
            El email es requerido
          </mat-error>
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
            Email inválido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
          <mat-error *ngIf="registerForm.get('password')?.invalid">
            Mínimo 6 caracteres
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Rol</mat-label>
          <mat-select formControlName="rol">
            <mat-option value="usuario">Usuario</mat-option>
            <mat-option value="administrador">Administrador</mat-option>
          </mat-select>
          <mat-icon matPrefix>admin_panel_settings</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary"
                class="full-width"
                type="submit"
                [disabled]="loading">

          <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
          <span *ngIf="!loading">Registrarse</span>

        </button>
      </form>

      <div class="login-link">
        <p>
          ¿Ya tienes cuenta?
          <a routerLink="/auth/login">Inicia sesión aquí</a>
        </p>
      </div>

    </mat-card-content>
  </mat-card>
</div>
