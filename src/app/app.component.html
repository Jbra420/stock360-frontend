<!-- Si HAY layout -->
<ng-container *ngIf="showLayout; else authLayout">

  <!-- Navbar principal -->
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="logo">
      <mat-icon>inventory_2</mat-icon>
      Stock360
    </span>

    <span class="spacer"></span>

    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="user-info">
        <p><strong>{{ usuario?.nombre }} {{ usuario?.apellido }}</strong></p>
        <p class="email">{{ usuario?.email }}</p>
        <p class="rol">{{ usuario?.rol }}</p>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        Cerrar Sesión
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer mode="side" opened class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>

        <a mat-list-item routerLink="/productos" routerLinkActive="active">
          <mat-icon>inventory_2</mat-icon>
          <span>Productos</span>
        </a>

        <a mat-list-item routerLink="/categorias" routerLinkActive="active" *ngIf="isAdmin">
          <mat-icon>category</mat-icon>
          <span>Categorías</span>
        </a>

        <a mat-list-item routerLink="/inventario" routerLinkActive="active">
          <mat-icon>sync_alt</mat-icon>
          <span>Inventario</span>
        </a>

        <a mat-list-item routerLink="/reportes" routerLinkActive="active">
          <mat-icon>assessment</mat-icon>
          <span>Reportes</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <!-- ✅ UN SOLO ROUTER OUTLET -->
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>

</ng-container>

<!-- Si NO HAY layout (login/register) -->
<ng-template #authLayout>
  <router-outlet></router-outlet>
</ng-template>
